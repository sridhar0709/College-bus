<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <title>Parent Portal | BusTrack</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">
  <main class="login-container">
    <div class="login-icon">👨‍👩‍👧</div>
    <h2>Parent Portal</h2>
    <p class="login-subtitle">Stay connected to your child’s campus transport.</p>
    {% with messages = get_flashed_messages() %}
      {% if messages %}<div class="alert">{{ messages[0] }}</div>{% endif %}
    {% endwith %}
    <form method="POST" action="{{ url_for('parent_login') }}">
      <label for="phone_no">Phone Number</label>
      <input id="phone_no" name="phone_no" type="tel" autocomplete="username" placeholder="Enter phone number" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter password" required>
      <button type="submit" class="btn parent-btn">Sign in to Parent</button>
    </form>
    <a href="{{ url_for('home') }}" class="back">← Back to BusTrack</a>
  </main>
</body>
</html>
