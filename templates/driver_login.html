<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <title>Driver Portal | BusTrack</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">
  <main class="login-container">
    <div class="login-icon">👨‍✈️</div>
    <h2>Driver Portal</h2>
    <p class="login-subtitle">Manage your assigned bus and publish GPS updates.</p>
    {% with messages = get_flashed_messages() %}
      {% if messages %}<div class="alert">{{ messages[0] }}</div>{% endif %}
    {% endwith %}
    <form method="POST" action="{{ url_for('driver_login') }}">
      <label for="driver_id">Driver ID</label>
      <input id="driver_id" name="driver_id" type="text" autocomplete="username" placeholder="Enter driver ID" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter password" required>
      <button type="submit" class="btn driver-btn">Sign in to Driver</button>
    </form>
    <a href="{{ url_for('home') }}" class="back">← Back to BusTrack</a>
  </main>
</body>
</html>
